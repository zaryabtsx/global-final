name: Deploy to cPanel
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Remove server-only API routes (not supported by static export)
        run: |
          rm -rf app/api/career
          rm -rf app/api/test-email
      - name: Replace Server Action with static-safe fetch wrapper
        run: |
          cat > app/actions/sendEmail.ts << 'EOF'
          // Static-export build: this calls the live Vercel deployment instead of running as a Server Action
          export async function sendADRFormEmail(formData: any, recipientEmails?: string | string[]) {
            const res = await fetch("https://global-final-amber.vercel.app/api/send-email", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ formData, recipientEmails }),
            });
            return res.json();
          }
          EOF
      - run: npm run build
        env:
          STATIC_EXPORT: "true"
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: ./
